<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carrom House</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  
    <main class="game-shell">
        
        <header class="title-panel">
            <p class="eyebrow">Local Tabletop Series</p>
            <h1>Carrom House</h1>
            <p class="subtitle">Two Players ~ One Board</p>

            <button class="wood-button" id="restartButton" type="button">Restart Match</button>
        </header>

        <section class="hud" aria-label="Match Scoreboard">

            <article class="player-panel is-active" id="player1Panel">
                <span class="panel-label">Player 1</span>
                <strong class="piece-name">White</strong>
                <span class="score" id="player1Score">00</span>

                <div class="coin-rack" id="player1Rack" aria-label="Player 1 pocketed coins"></div>
            </article>

            <div class="turn-panel">

                <span class="panel-label">Now shooting</span>
                <strong id="turnName">Player 1</strong>

                <span class="ruling" id="rulingText">Player 1 breaks</span>
            </div>

            <article class="player-panel" id="player2Panel">

                <span class="panel-label">Player 2</span>
                <strong class="piece-name">Black</strong>

                <span class="score" id="player2Score">00</span>

                <div class="coin-rack" id="player2Rack" aria-label="Player 2 pocketed coins"></div>
            </article>

        </section>

        <div class="board-stage">

            <div class="board-frame">

                <canvas id="gameCanvas" width="760" height="760" aria-label="Two-player Carrom Board"></canvas>
            </div>

            <section class="game-over" id="gameOver" hidden>

                <span class="game-over-kicker">Match Complete</span>
                <h2 id="winnerText">Player 1 wins</h2>
                <p id="finalScore">12 - 9</p>

                <button class="wood-button" id="playAgainButton" type="button">New Match</button>

            </section>
        </div>

        <p class="table-note">Place on your line. Pull back. Release to strike</p>

    </main>

    <script src="vendor/matter.min.js"></script>
    <script src="game.js"></script>
    
</body>
</html>
